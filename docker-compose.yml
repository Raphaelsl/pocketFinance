version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=pocket
      - POSTGRES_PASSWORD=pocketpass
      - POSTGRES_DB=pocketdb
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
  adminer:
    image: adminer
    restart: always
    ports:
      - "8081:8080"

volumes:
  db-data: