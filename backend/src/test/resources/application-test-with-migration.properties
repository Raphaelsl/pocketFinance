spring.datasource.url=jdbc:h2:mem:testdb_migration;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=pocket
spring.datasource.password=${DB_PASSWORD:pocketpass}

spring.flyway.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate



spring.flyway.locations=classpath:db/test_migration