# H2 Database in-memory configurado para emular PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=pocket
spring.datasource.password=pocketpass

# DESLIGAR O FLYWAY NOS TESTES (Hibernate cuida da schema)
spring.flyway.enabled=false

# DEIXAR O HIBERNATE CRIAR AS TABELAS DO ZERO (Inclui o tipo enum)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Logs (Reduzir polui??o visual)
logging.level.org.springframework=WARN
logging.level.org.flywaydb=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.pocketfinance=INFO

# Force test profile to avoid dev Postgres during tests
spring.profiles.active=test
